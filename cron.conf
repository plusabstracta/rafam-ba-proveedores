# cron.conf — Scheduler del pipeline RAFAM -> Paxapos
#
# Fuente de verdad de horarios usada por scripts/install_crons.sh.

# Corrida del pipeline cada 10 minutos: procesa TODAS las entidades en orden
# de FK dentro de un mismo proceso (proveedores -> oc_items -> solic_gastos ->
# orden_pago -> retenciones) y registra el resultado. NO envia mail por corrida.
PIPELINE_SCHEDULE="*/10 * * * *"   # cada 10 minutos, pipeline completo

# Resumen diario por email: UN unico mail con el total del dia (tiempo total en
# min/seg y, si hubo errores, que entidad fallo y que devolvio el migrator).
# Purga del historial las corridas ya reportadas.
DAILY_REPORT_SCHEDULE="55 23 * * *"   # cada dia a las 23:55

# check_integrity: una vez por dia, fuera de horario (no pisarse con la corrida)
INTEGRITY_SCHEDULE="0 2 * * *"     # cada dia a las 02:00
