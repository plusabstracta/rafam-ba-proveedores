# cron.conf — Frecuencias del scheduler por entidad
# Formato cron estándar para cada franja horaria.
# HORARIO_LABORAL: 07:00 a 16:00 (lunes a viernes, o todos los días según negocio)
# FUERA_HORARIO  : 16:00 a 07:00 del siguiente día
#
# Regla de oro: el intervalo debe ser MAYOR que la duración incremental esperada.
# Ver columna "Duración incremental esperada" en el README o plan de implementación.

# proveedores: pocos cambios, no tan crítico
PROV_LABORAL="*/15 7-15 * * *"    # cada 15 min de 7:00 a 15:45
PROV_FUERA="0 16-23,0-6 * * *"    # cada hora fuera de horario

# oc_items: OCs se crean durante el día laboral
OC_LABORAL="*/2 7-15 * * *"        # cada 2 min de 7:00 a 15:58
OC_FUERA="0 16-23,0-6 * * *"       # cada hora fuera de horario

# solic_gastos: idem OC
SG_LABORAL="*/2 7-15 * * *"
SG_FUERA="0 16-23,0-6 * * *"

# orden_pago: pagos en horario laboral
OP_LABORAL="*/2 7-15 * * *"
OP_FUERA="0 16-23,0-6 * * *"

# retenciones: va despues de OPs, levemente desfasado
RET_LABORAL="*/2 7-15 * * *"
RET_FUERA="0 16-23,0-6 * * *"

# check_integrity: una vez por dia, fuera de horario (no pisarse con migraciones)
INTEGRITY_SCHEDULE="0 2 * * *"    # cada dia a las 02:00
