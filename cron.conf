# cron.conf — Scheduler del pipeline RAFAM -> Paxapos
#
# Fuente de verdad de horarios usada por scripts/install_crons.sh.

# Una sola corrida cada 10 minutos que procesa TODAS las entidades en orden
# de FK dentro de un mismo proceso:
#   proveedores -> oc_items -> solic_gastos -> orden_pago -> retenciones
#
# Al terminar la corrida COMPLETA se envia UN unico mail con la duracion total
# y, si hubo errores, el detalle por entidad y la respuesta del migrator.
PIPELINE_SCHEDULE="*/10 * * * *"   # cada 10 minutos, pipeline completo

# check_integrity: una vez por dia, fuera de horario (no pisarse con la corrida)
INTEGRITY_SCHEDULE="0 2 * * *"     # cada dia a las 02:00
